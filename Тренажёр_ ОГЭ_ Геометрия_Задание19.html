    const nameInput = document.getElementById('nameInput');
    let name = nameInput.value.trim();
    if (!name) { alert("Пожалуйста, введи имя 🙌"); return; }
    studentName = name;

    let count = parseInt(document.getElementById('countInput').value);
    if (isNaN(count) || count < 1) count = statements.length;
    if (count > statements.length) count = statements.length;

    const all = [...statements];
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }
    shuffled = all.slice(0, count);
    currentIndex = 0;
    correctCount = 0;
    answered = [];
    renderQuestion();
  }

  function counterHTML() {
    return `<div class="counter">📊 Пройдено: ${currentIndex}/${shuffled.length} | ✅ Верно: ${correctCount}</div>`;
  }

  function renderQuestion() {
    if (currentIndex >= shuffled.length) { showResults(); return; }
    const s = shuffled[currentIndex];
    app.innerHTML = `
      ${counterHTML()}
      <div class="card" id="qCard">
        <h3>📌 Утверждение ${currentIndex + 1}</h3>
        <p style="font-size: 1.3rem; margin: 24px 0;">${s.text}</p>
        <div class="answers">
          <button class="btn" onclick="checkAnswer(true)">✅ Верно</button>
          <button class="btn" onclick="checkAnswer(false)">❌ Неверно</button>
        </div>
      </div>
    `;
  }

  function checkAnswer(userAns) {
    const card = document.getElementById('qCard');
    const s = shuffled[currentIndex];
    const isRight = (userAns === s.correct);
    answered.push({ text: s.text, correct: s.correct, answer: userAns });
    if (isRight) correctCount++;
    card.classList.add(isRight ? 'correct' : 'wrong');
    const feedbackEmoji = isRight ? '🎉✨' : '📘✏️';
    const remark = isRight ? 'Отлично!' : 'Попробуй запомнить правило';
    const correctWord = s.correct ? 'Верно' : 'Неверно';
    const ansDiv = card.querySelector('.answers');
    if (ansDiv) ansDiv.remove();
    card.innerHTML += `
      <div class="feedback">
        <div>${feedbackEmoji} ${remark}</div>
        <p>Правильный ответ: <strong>${correctWord}</strong></p>
      </div>
      <button class="btn btn-primary next-btn" style="margin-top:24px;" onclick="nextQuestion()">➡️ Следующее задание</button>
    `;
    const counterDiv = document.querySelector('.counter');
    if (counterDiv) counterDiv.innerText = `📊 Пройдено: ${currentIndex+1}/${shuffled.length} | ✅ Верно: ${correctCount}`;
  }

  function nextQuestion() {
    currentIndex++;
    renderQuestion();
  }

  function showResults() {
    const percent = Math.round((correctCount / shuffled.length) * 100);
    const mistakes = answered.filter(a => a.answer !== a.correct);
    let comment = percent >= 80 ? 'Прекрасный результат!' : percent >= 50 ? 'Хорошо, но есть куда расти' : 'Повторите теорию и попробуйте ещё';
    const mistakesHtml = mistakes.length ? `
      <div class="mistakes">
        <h3>🧠 Ошиблись в этих утверждениях:</h3>
        <ul style="margin-left:20px;">
          ${mistakes.map(m => `<li><strong>«${m.text}»</strong><br>→ верно: <span style="color:#f5a623;">${m.correct ? 'Верно' : 'Неверно'}</span></li>`).join('')}
        </ul>
        <p>Разберите их — и геометрия станет ближе 💪</p>
      </div>
    ` : '<p style="color:#1e5f4b;">🌟 Идеально! Вы мастер геометрии!</p>';
    app.innerHTML = `
      <div id="resultCard" class="card" style="text-align:center;">
        <h2>${studentName}, ${comment}</h2>
        <div class="circle" style="--percent:${percent}"><div class="percent">${percent}%</div></div>
        <p style="font-size:1.2rem; margin: 16px 0;">Правильно: ${correctCount} из ${shuffled.length}</p>
        ${mistakesHtml}
        <button class="btn btn-primary download-btn" onclick="downloadPNG()" style="margin-top: 20px;">📸 Скачать результат (PNG)</button>
        <br><br>
        <button class="btn" onclick="location.reload();" style="margin-top: 12px;">🔄 Пройти ещё раз</button>
      </div>
    `;
  }

  async function downloadPNG() {
    const node = document.getElementById('resultCard');
    const btn = node.querySelector('.download-btn');
    if (btn) btn.style.display = 'none';
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff' });
    const link = document.createElement('a');
    link.download = `результат_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    if (btn) btn.style.display = '';
  }

  window.validateCount = validateCount;
  window.startGame = startGame;
  window.checkAnswer = checkAnswer;
  window.nextQuestion = nextQuestion;
  window.downloadPNG = downloadPNG;

  document.getElementById('countInput')?.addEventListener('input', (e) => validateCount(e.target.value));
</script>

</body>
</html>
